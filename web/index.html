<style>
/* Boot CSS is inline deliberately: render a useful recovery page even if
   an external stylesheet or the JavaScript module graph cannot load. */
#app>.loading{box-sizing:border-box;position:absolute;inset:0;display:flex;
 flex-direction:column;align-items:center;justify-content:center;gap:12px;
 padding:28px;text-align:center;margin:0;font:16px/1.5 system-ui,sans-serif;
 color:#176c59;background:#f9faf6}
.loading-mark{font-size:38px;line-height:1.2}
.loading h1{font-size:clamp(20px,4vw,25px);line-height:1.3;margin:0;color:#96372e}
.loading p{font-size:14px;line-height:1.65;max-width:360px;margin:0;color:#465d52}
.skip-to-calendar{position:fixed;inset-block-start:8px;inset-inline-start:-9999px;
 z-index:9999;background:#f9faf6;color:#176c59;padding:12px 18px;border:2px solid currentColor;
 border-radius:10px;font:bold 16px/1.4 system-ui,sans-serif}
.skip-to-calendar:focus{inset-inline-start:8px}
.nojs-fallback{box-sizing:border-box;position:fixed;inset:0;z-index:30;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:28px;text-align:center;gap:14px;background:#f9faf6;color:#283e33;
 font:16px/1.6 system-ui,sans-serif}
.nojs-fallback h1{color:#96372e;margin:0;font-size:25px}
.nojs-fallback p{max-width:380px;margin:0}
.loading-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.renpet-startup-failed{box-sizing:border-box;min-height:100%;padding:36px 24px 70px;
 background:#f9faf6;color:#202a25;display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center;font:16px/1.6 system-ui,sans-serif}
.renpet-startup-failed h1{color:#96372e;margin:10px 0 6px;font-size:25px}
.renpet-startup-failed p{max-width:340px;color:#52645b}
.renpet-startup-failed button{border:0;border-radius:12px;min-height:48px;min-width:215px;
 background:#176c59;color:white;font:bold 17px system-ui;padding:12px;margin:7px}
.renpet-startup-failed button.secondary{background:#f1e9e6;color:#96372e;border:1px solid #d6b6ae}
</style>
<script>
(function () {
 let ready = false;
 let timer = null;
 function fail(reason) {
  if (ready) return;
  const el = document.getElementById('app');
  if (!el) return;
  if (el.querySelector('.app-shell')) { ready = true; return; }
  el.innerHTML = '<div class="renpet-startup-failed" role="alert">'+
   '<div style="font-size:44px;color:#176c59" aria-hidden="true">𓆳</div>'+
   '<h1>تعذّر تشغيل رنبت</h1>'+
   '<p>لم يكتمل تحميل التقويم. مواعيدك المحفوظة لم تُحذف.</p>'+
   '<p>Calendar could not finish starting. Your saved appointments have not been deleted.</p>'+
   '<button type="button" data-retry>إعادة المحاولة · Retry</button>'+
   (navigator.onLine?'<button type="button" class="secondary" data-repair>إصلاح التحديث · Repair update</button>':'')+
   '</div>';
  el.querySelector('[data-retry]').addEventListener('click', function(){location.reload();});
  const repair = el.querySelector('[data-repair]');
  if (repair) repair.addEventListener('click', async function () {
   repair.disabled = true;
   try {
    if (navigator.serviceWorker) {
     // Only unregister this Renpet installation. Other origin-wide service
     // workers must not be touched by an application repair action.
     const appScope = new URL('./', location.href);
     const expectedScript = new URL('./sw.js', location.href).href;
     const registration = await navigator.serviceWorker.getRegistration(appScope);
     const actualScript = registration?.active?.scriptURL ||
       registration?.waiting?.scriptURL || registration?.installing?.scriptURL;
     if (registration && actualScript && new URL(actualScript).href === expectedScript)
       await registration.unregister();
    }
   } catch (error) { console.warn('Renpet boot repair',error); }
   // Unregisters only the app shell service worker, not localStorage or data.
   location.reload();
  });
  console.error('Renpet startup incomplete:', reason);
 }
 window.RenpetBoot = {
  ready: function () { ready = true; clearTimeout(timer); },
  fail: fail
 };
 // A previous installed release may serve stale app.js and festival data
 // from CacheStorage, even after its replacement has been deployed.
 // Discover the new worker *before* the module starts, and reload once
 // when a newer worker takes control. Never discard an open editor draft.
 if ('serviceWorker' in navigator) {
  const previousController = navigator.serviceWorker.controller;
  let handledUpgrade = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
   if (!previousController || handledUpgrade || navigator.onLine === false) return;
   handledUpgrade = true;
   if (document.querySelector('#event-editor')) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = 'تحديث رنبت · Update Renpet';
    button.setAttribute('aria-label', 'تحديث رنبت · Update Renpet');
    button.style.cssText = 'position:fixed;z-index:9999;bottom:18px;left:18px;'+
     'padding:12px 18px;border:0;border-radius:12px;background:#176c59;'+
     'color:white;font:600 15px system-ui;box-shadow:0 2px 12px #0003';
    button.addEventListener('click', function () { location.reload(); });
    document.body.appendChild(button);
    return;
   }
   location.reload();
  });
  function checkForUpdates() {
   if (navigator.onLine === false) return;
   navigator.serviceWorker.getRegistration().then(function (registration) {
    if (registration) return registration.update();
   }).catch(function (error) { console.warn('Renpet update check', error); });
  }
  checkForUpdates();
  // Standalone Home Screen PWAs can stay suspended for days rather than
  // navigating afresh. Recheck when the app returns to the foreground.
  window.addEventListener('pageshow', function (event) {
   if (event.persisted) checkForUpdates();
  });
  document.addEventListener('visibilitychange', function () {
   if (!document.hidden) checkForUpdates();
  });
 }
 window.addEventListener('error', function (event) {
  // A broken module import leaves the HTML loading placeholder unchanged.
  if (!ready && event.target && event.target.tagName === 'SCRIPT') {
   setTimeout(function () { fail('module script unavailable'); }, 0);
  }
 }, true);
 timer = setTimeout(function () { fail('startup deadline exceeded'); }, 9000);
})();
</script>
