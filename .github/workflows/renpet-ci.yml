name: Renpet CI and automatic keyboard dependency updates
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/**'
      - 'tests/**'
      - 'keyboard-lock.json'
      - '.github/workflows/renpet-ci.yml'
  pull_request:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: renpet-keyboards-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: true}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - name: Check pinned dependencies or stage independent upstream updates
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            python tools/sync_keyboards.py --verify
          else
            python tools/sync_keyboards.py
          fi
      - name: Run standalone calendar, keyboard and offline verification
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/keyboard-search.mjs
          node tests/keyboard.test.mjs
          node tests/scheduler.test.mjs
          node tests/calendar-presentation.test.mjs
          node tests/festival-catalog.test.mjs
          node tests/ui.test.mjs
          node tests/backup.test.mjs
          node --test tests/alerts.test.mjs tests/responsive-layout.test.mjs
          bash tools/build_release.sh
          python tools/sync_keyboards.py --verify
          python tests/test_app_icons.py
          python tests/test_service_worker_source.py
          test -s web/coptic-lexicon/manifest.json
          test -s web/lexicon/manifest.json
          test ! -e web/assets/dictionaries/coptic.json
          test ! -e web/lexicon/lexicon.sqlite3
      - name: Commit updated lock and checked browser assets
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git add keyboard-lock.json web/keyboards/ web/lexicon/ web/coptic-lexicon/ web/lexicon-install.mjs web/coptic-install.mjs web/assets/dictionaries/signs.json
          if git diff --cached --quiet; then
            echo 'Keyboard releases unchanged'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update independently verified upstream keyboard releases'
            git push origin HEAD:main
          fi
      - name: Install Cloudflare Wrangler ONLY after explicit cutover
        if: github.event_name != 'pull_request' && vars.CUTOVER_ENABLED == 'true'
        run: npm install --global wrangler@4
      - name: Deploy Renpet only after explicit cutover and green regression
        if: github.event_name != 'pull_request' && vars.CUTOVER_ENABLED == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.worker.toml
          curl --fail --silent --show-error --retry 5 https://renpet.sydgouda.workers.dev/ > /tmp/renpet-production-check.html
          test -s /tmp/renpet-production-check.html
