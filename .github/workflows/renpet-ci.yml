name: Renpet CI with pinned headless keyboard APIs
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/**'
      - 'tests/**'
      - 'keyboard-lock.json'
      - 'worker.mjs'
      - 'wrangler.worker.toml'
      - '.github/workflows/renpet-ci.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_now:
        description: 'Deploy the verified main branch to Cloudflare Workers'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: renpet-keyboards-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: true}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - name: Verify locked executable source modules and lexicon releases
        run: python tools/sync_keyboards.py --verify
      - name: Run standalone calendar, keyboard and offline verification
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/keyboard-api.mjs
          node --check web/keyboards/cop/core.mjs
          node --check web/keyboards/cop/editor.mjs
          node --check web/keyboards/egy/keyboard_api.mjs
          node --test tests/*.test.mjs
          bash tools/build_release.sh
          python tools/sync_keyboards.py --verify
          python tests/test_app_icons.py
          python tests/test_service_worker_source.py
          test -s web/coptic-lexicon/manifest.json
          test -s web/lexicon/manifest.json
          test ! -e web/assets/dictionaries/coptic.json
          test ! -e web/lexicon/lexicon.sqlite3
      - name: Install mandatory browser engines
        run: |
          npm install --no-save --prefix /tmp/renpet-pw playwright@1.56.1
          /tmp/renpet-pw/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Serve packaged PWA for release gating
        run: |
          nohup python -m http.server 8765 --bind 127.0.0.1 --directory web > /tmp/renpet-http.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Gate deployment on phone tablet WebKit and offline regressions
        env:
          NODE_PATH: /tmp/renpet-pw/node_modules
        run: |
          node tests/mobile-ux.cjs
          node tests/calendar-integrity.cjs
          node tests/season-theme.cjs
          node tests/real-user-journeys.cjs
          node tests/safari-save.cjs
          node tests/safari-direct-actions.cjs
          node tests/offline-startup.cjs
      - name: Install Cloudflare Wrangler ONLY after explicit cutover
        if: github.event_name != 'pull_request' && (vars.CUTOVER_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_now) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-cloudflare]')))
        run: npm install --global wrangler@4
      - name: Deploy Renpet only after explicit cutover and green regression
        if: github.event_name != 'pull_request' && (vars.CUTOVER_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_now) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-cloudflare]')))
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.worker.toml
          curl --fail --silent --show-error --retry 5 https://renpet.sydgouda.workers.dev/ > /tmp/renpet-production-check.html
          test -s /tmp/renpet-production-check.html
